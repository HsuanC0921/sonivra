[package]
name = "sonivra"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native Windows local speech recognition and live translation subtitles"
readme = "README.md"
keywords = ["subtitles","speech-recognition","translation","windows","slint"]
categories = ["multimedia::audio","accessibility"]
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossbeam-channel = "0.5"
futures-util = "0.3"
hound = "3.5"
libloading = "0.9"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030", "accessibility"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
toml = "0.9"
wasapi = "0.27"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_SystemInformation", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Globalization"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "Sonivra"
path = "src/main.rs"
